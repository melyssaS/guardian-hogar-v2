# Orquestación local de demo — imágenes compiladas (equivale a producción).
#   docker compose up --build
# Frontend en http://localhost:8080 ; backend en http://localhost:3000.
services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      PORT: 3000
      DB_FILE: /app/data/guardian.db
      # Orígenes permitidos: el frontend servido por nginx en 8080.
      CORS_ORIGINS: http://localhost:8080
    volumes:
      # BD SQLite en volumen nombrado — sobrevive a los rebuilds (skill backend).
      - guardian-db:/app/data
    ports:
      # 3100 en el host para no chocar con `npm run dev:backend` (3000). El
      # frontend llega al backend por la red interna de compose, no por este puerto.
      - '3100:3000'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:3000
    ports:
      - '8080:8080'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  guardian-db:
