# nginx — sirve la SPA y hace proxy de /api hacia el backend.
# BACKEND_URL se inyecta en tiempo de arranque (envsubst) desde la variable de entorno.
server {
    listen       ${PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compresión básica de estáticos.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Las peticiones /api van al backend.
    location /api/ {
        # Resolver DNS (necesario para reenviar a un host externo como Render).
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend ${BACKEND_URL};
        proxy_pass         $backend;
        proxy_http_version 1.1;

        # El backend externo (Render) enruta por Host/SNI: hay que enviarle SU host,
        # no el del frontend. $proxy_host es el host extraído de $backend.
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Upstream HTTPS: enviar SNI con el nombre del backend en el handshake TLS.
        proxy_ssl_server_name on;

        proxy_read_timeout 90s;
    }

    # Rutas SPA: cualquier ruta desconocida devuelve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
